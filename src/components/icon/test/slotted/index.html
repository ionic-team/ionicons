<!doctype html>
<html dir="ltr" lang="en" mode="ios">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Icon - Slotted Content</title>
    <script type="module" src="/build/ionicons.esm.js"></script>
    <script nomodule src="/build/ionicons.js"></script>
    <link rel="stylesheet" href="../styles.css" />
    <script src="../header.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <!-- Phosphor Icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <test-header></test-header>

      <div class="grid">
        <div class="grid-item">
          <h2>Material Icons</h2>
          <ion-icon>
            <span class="material-icons">home</span>
          </ion-icon>
          <ion-icon>
            <span class="material-icons">favorite</span>
          </ion-icon>
          <ion-icon>
            <span class="material-icons">star</span>
          </ion-icon>
          <ion-icon>
            <span class="material-icons">person</span>
          </ion-icon>
          <ion-icon>
            <span class="material-icons">settings</span>
          </ion-icon>

          <br />

          <ion-icon color="primary">
            <span class="material-icons">home</span>
          </ion-icon>
          <ion-icon color="secondary">
            <span class="material-icons">favorite</span>
          </ion-icon>
          <ion-icon color="success">
            <span class="material-icons">star</span>
          </ion-icon>
          <ion-icon color="warning">
            <span class="material-icons">warning</span>
          </ion-icon>
          <ion-icon color="danger">
            <span class="material-icons">delete</span>
          </ion-icon>

          <br />

          <ion-icon style="font-size: 24px">
            <span class="material-icons">home</span>
          </ion-icon>
          <ion-icon style="font-size: 36px">
            <span class="material-icons">favorite</span>
          </ion-icon>
          <ion-icon style="font-size: 48px">
            <span class="material-icons">star</span>

        <div class="grid-item">

          </ion-icon>
          <ion-icon>
            <i class="ph-fill ph-star"></i>
          </ion-icon>
          <ion-icon>
            <i class="ph-fill ph-user"></i>
          </ion-icon>
          <ion-icon>
            <i class="ph-fill ph-gear"></i>
          </ion-icon>

            <i class="ph-fill ph-house"></i>

            <i class="ph-fill ph-heart"></i>
          </ion-icon>
          <ion-icon style="font-size: 48px">
            <i class="ph-fill ph-star"></i>

        <div class="grid-item">
